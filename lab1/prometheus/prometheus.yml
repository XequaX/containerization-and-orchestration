global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/rules/alerts.yml

scrape_configs:
  - job_name: "mydocker-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: "cadvisor"
    scrape_interval: 5s
    static_configs:
      - targets: ["cadvisor:8080"]
